spring:
  # Configura��o do Datasource para o RDS na AWS
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  # Configuração AWS para produção (sem credenciais, sem endpoint)
  cloud:
    aws:
      region:
        static: ${AWS_REGION}

# Configuração de Log para produção
logging:
  level:
    com.fiap.autohub: INFO
    org.springframework: WARN
    org.hibernate: WARN