name: CI/CD Pipeline - AutoHub Sales API Java

# Gatilhos: Rodar em push para main/develop e PRs para main/develop
on:
  push:
    branches:
      - main # ou master
      - develop
  pull_request:
    branches:
      - main # ou master
      - develop

jobs:
  # --- Job de Build e Teste (CI) ---
  build-and-test:
    name: Build & Test Sales API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build and Test with Maven Wrapper
        run: ./mvnw clean package

  # --- Job de Deploy (CD) ---
  deploy-to-lambda:
    name: Deploy Sales API to AWS Lambda (Dev)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build Shaded JAR with Maven Wrapper
        run: ./mvnw clean package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find Shaded JAR File
        id: find_jar
        run: |
          # Encontra o JAR shaded gerado pelo build
          # Ajuste o padrão do nome se for diferente
          JAR_FILE=$(find target -maxdepth 1 -name 'autohub-sales-api-*-SNAPSHOT.jar' -not -name '*-plain.jar' -not -name '*-original.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Shaded JAR file not found in target/!"
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Upload JAR to S3
        run: |
          aws s3 cp ${{ steps.find_jar.outputs.jar_path }} s3://${{ secrets.S3_DEPLOY_BUCKET }}/${{ secrets.S3_DEPLOY_KEY_SALES }}
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME_SALES }} \
            --s3-bucket ${{ secrets.S3_DEPLOY_BUCKET }} \
            --s3-key ${{ secrets.S3_DEPLOY_KEY_SALES }} \
            --publish # Publica nova versão
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}