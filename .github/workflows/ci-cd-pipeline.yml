name: CI/CD Pipeline - AutoHub Sales API Java (Single Env)

# Gatilhos: Rodar em push para main/develop e PRs para main/develop
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # --- Job de Build e Teste (CI) ---
  build-and-test:
    name: Build & Test Sales API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build and Test with Maven Wrapper
        # Executa build e testes
        run: ./mvnw clean package

      - name: Find Shaded JAR File for Upload
        id: find_jar_for_upload
        run: |
          # Procura pelo JAR com o classifier '-aws.jar'
          JAR_FILE=$(find target -maxdepth 1 -name 'autohub-sales-api-*-SNAPSHOT-aws.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Shaded JAR file with classifier '-aws.jar' not found in target/!"
            # Fallback sem classifier
            JAR_FILE=$(find target -maxdepth 1 -name 'autohub-sales-api-*-SNAPSHOT.jar' -not -name '*-plain.jar' -not -name '*-original.jar' | head -n 1)
            if [ -z "$JAR_FILE" ]; then
               echo "Fallback: Shaded JAR file without classifier not found either!"
               exit 1
            fi
            echo "Warning: Found JAR without '-aws' classifier: $JAR_FILE"
          fi
          echo "Found JAR for upload: $JAR_FILE"
          JAR_FILENAME=$(basename "$JAR_FILE")
          echo "JAR Filename: $JAR_FILENAME"
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "jar_filename=$JAR_FILENAME" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-api-jar
          path: ${{ steps.find_jar_for_upload.outputs.jar_path }}

  # --- Job de Deploy (CD) ---
  deploy-to-lambda:
    name: Deploy Sales API to AWS Lambda
    runs-on: ubuntu-latest
    needs: build-and-test
    # Trigger no push para a branch 'main' (ajuste se necessário)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: sales-api-jar
          path: target/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find Shaded JAR File Path and Name
        id: find_jar
        run: |
          # Procura pelo JAR descarregado
          JAR_FILE=$(find target -maxdepth 1 -name 'autohub-sales-api-*-SNAPSHOT-aws.jar' | head -n 1)
           if [ -z "$JAR_FILE" ]; then
             JAR_FILE=$(find target -maxdepth 1 -name 'autohub-sales-api-*-SNAPSHOT.jar' -not -name '*-plain.jar' -not -name '*-original.jar' | head -n 1)
             if [ -z "$JAR_FILE" ]; then
               echo "Shaded JAR file not found in target/ after download!"
               exit 1
             fi
             echo "Warning: Found JAR without '-aws' classifier after download: $JAR_FILE"
           fi
          echo "Found JAR: $JAR_FILE"
          JAR_FILENAME=$(basename "$JAR_FILE")
          echo "JAR Filename for S3 Key: $JAR_FILENAME"
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "jar_filename=$JAR_FILENAME" >> $GITHUB_OUTPUT

      - name: Upload JAR to S3
        run: |
          aws s3 cp ${{ steps.find_jar.outputs.jar_path }} s3://${{ secrets.S3_DEPLOY_BUCKET }}/${{ secrets.S3_DEPLOY_KEY_SALES }}
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Update HTTP Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME_SALES_HTTP }} \ 
            --s3-bucket ${{ secrets.S3_DEPLOY_BUCKET }} \
            --s3-key ${{ steps.find_jar.outputs.jar_filename }} \ 
            --publish
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Update SQS Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME_SALES_SQS }} \ 
            --s3-bucket ${{ secrets.S3_DEPLOY_BUCKET }} \
            --s3-key ${{ steps.find_jar.outputs.jar_filename }} \
            --publish
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
